# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zab.be.resa.zuidrawapp
type: application
server:
  customMiddleware:
    # Mode local/offline : aucune résolution du framework via npm. Les ressources
    # SAPUI5 sont servies depuis le SDK local (C:/Users/dgaland/projects/SAPUI5),
    # et la bibliothèque zab.be.resa.draw depuis library/dist (chemin BSP vers
    # lequel pointe le resourceRoots partagé de webapp/index.html et
    # flpSandbox.html). servestatic est enregistré AVANT le proxy, donc rien ne
    # part vers DTA 300 / ui5.sap.com pour ces chemins.
    - name: fiori-tools-servestatic
      afterMiddleware: compression
      configuration:
        paths:
          - path: /resources
            src: "C:/Users/dgaland/projects/SAPUI5/resources"
          - path: /sap/bc/ui5_ui5/sap/zuiablibrdraw/resources/zab/be/resa/draw
            src: "library/dist/resources/zab/be/resa/draw"
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transpileAsync: true
        transpileTypeScript: true
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-proxy
      # Enregistré APRÈS servestatic pour que le chemin BSP de la bibliothèque
      # soit servi localement et non transféré vers DTA 300.
      afterMiddleware: fiori-tools-servestatic
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://tec0033wi.tecteo.adms:8000
            destination: DTACLNT310
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: zab.be.resa.zuidrawapp
        ui5Theme: sap_fiori_3
