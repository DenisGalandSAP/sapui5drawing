# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zab.be.resa.zuidrawapp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        removeConsoleStatements: true
        transpileAsync: true
        transpileTypeScript: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://tec0033wi.tecteo.adms:8000
          client: "300"
        app:
          name: ZUI_AB_DRAW_APP
          description: "AB : Draw App"
          package: ZTEC_AB
          transport: DTAK976940
        exclude:
          - /test/
