# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zab.be.resa.zuilibrdraw
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DTACLNT300
          url: http://resawdt:45300
        app:
          name: ZUI_AB_LIBR_DRAW
          description: "AB : Draw Manage"
          package: ZTEC_AB
          transport: REPLACE_WITH_TRANSPORT
        exclude:
          - /test/
