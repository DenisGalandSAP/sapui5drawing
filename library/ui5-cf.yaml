# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
#
# Build de la bibliothèque zab.be.resa.draw pour le HTML5 Application Repository
# (SAP BTP / Work Zone). ui5-task-zipper retire le préfixe /resources/zab/be/resa/draw
# et produit dist/zabberesadraw.zip (contenu à la racine, avec xs-app.json).
# Une fois déployée, la bibliothèque est servie sous /zabberesadraw.zabberesadraw/.

specVersion: "3.1"
metadata:
  name: zab.be.resa.draw
type: library
framework:
  name: SAPUI5
  version: 1.142.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_fiori_3
resources:
  configuration:
    paths:
      src: src
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        removeConsoleStatements: true
        transpileAsync: true
        transpileTypeScript: true
    - name: ui5-task-zipper
      afterTask: buildThemes
      configuration:
        archiveName: zabberesadraw
        relativePaths: true
        additionalFiles:
          - xs-app.json
