# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
#
# Déploiement de la bibliothèque zab.be.resa.draw comme BSP autonome.
# La tâche ui5-task-flatten-library aplatit l'arborescence /resources/<namespace>
# afin que la bibliothèque puisse être déployée comme une application BSP et
# servie sous /resources/zab/be/resa/draw sur le serveur ABAP.

specVersion: "3.1"
metadata:
  name: zab.be.resa.draw
type: library
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        removeConsoleStatements: true
        transpileAsync: true
        transpileTypeScript: true
    - name: ui5-task-flatten-library
      afterTask: generateLibraryPreload
    - name: deploy-to-abap
      afterTask: ui5-task-flatten-library
      configuration:
        target:
          url: http://tec0033wi.tecteo.adms:8000
          client: "300"
        credentials:
          username: env:USR
          password: env:SAP_PWD
        app:
          name: ZUIABLIBRDRAW
          description: "AB : Draw Manage Library"
          package: ZTEC_AB
          transport: DTAK976940
        # Le serveur ABAP rejette les fichiers TypeScript (type inconnu) et fait
        # échouer tout l'envoi (HTTP 400) : on les exclut de l'archive déployée.
        exclude:
          - '\.ts$'
          - '\.d\.ts\.map$'
