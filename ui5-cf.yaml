# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
#
# Build de l'application pour le HTML5 Application Repository (SAP BTP / Work Zone).
# Produit dist/zabberesazuidrawapp.zip (avec xs-app.json), repris par mta.yaml.

specVersion: "3.1"
metadata:
  name: zab.be.resa.zuidrawapp
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        removeConsoleStatements: true
        transpileAsync: true
        transpileTypeScript: true
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: zabberesazuidrawapp
        relativePaths: true
        additionalFiles:
          - xs-app.json
