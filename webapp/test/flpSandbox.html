<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{appTitle}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <style>
        html, body, body > div, #content {
            height: 100%;
        }
    </style>

    <script type="text/javascript">
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            applications: {
                "ZuiAbLibrDraw-display": {
                    title: "Drawing Board",
                    description: "AB - Drawing reuse component",
                    additionalInformation: "SAPUI5.Component=zab.be.resa.zuilibrdraw",
                    applicationType: "URL",
                    url: "../",
                    navigationMode: "embedded"
                }
            }
        };
    </script>

    <script src="../test-resources/sap/ushell/bootstrap/sandbox.js"
        id="sap-ushell-bootstrap"></script>

    <script id="sap-ui-bootstrap"
        src="../resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ushell, sap.ui.core, sap.suite.ui.generic.template"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-theme="sap_fiori_3"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-bindingSyntax="complex"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{
            "zab.be.resa.zuilibrdraw": "../"
        }'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ushell.Container.createRenderer().placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
