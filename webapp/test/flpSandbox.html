<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{appTitle}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <style>
        html, body, body > div, #content {
            height: 100%;
        }
    </style>

    <script id="sap-ui-bootstrap"
        src="../resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ui.core, sap.uxap"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-theme="sap_fiori_3"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-bindingSyntax="complex"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{
            "zab.be.resa.zuilibrdraw": "../"
        }'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/ui/core/mvc/XMLView",
                "sap/ui/model/resource/ResourceModel"
            ], function (XMLView, ResourceModel) {
                var oI18nModel = new ResourceModel({
                    bundleName: "zab.be.resa.zuilibrdraw.i18n.i18n"
                });

                XMLView.create({
                    viewName: "zab.be.resa.zuilibrdraw.view.Main"
                }).then(function (oView) {
                    oView.setModel(oI18nModel, "i18n");
                    oView.placeAt("content");
                });
            });
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
